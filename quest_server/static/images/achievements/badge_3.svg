    <linearGradient id="cyanbolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/><stop offset="40%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#0891b2"/>
