<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="bg8" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#090514"/>
    </radialGradient>
    <linearGradient id="steel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/><stop offset="50%" stop-color="#94a3b8"/><stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="ruby" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af"/><stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
  </defs>
  <circle cx="64" cy="64" r="60" fill="url(#bg8)" stroke="#818cf8" stroke-width="3"/>
  <!-- Sword 1: Top-Left to Bottom-Right -->
  <g transform="rotate(45 64 64)">
    <polygon points="62,18 66,18 67,82 61,82" fill="url(#steel)"/>
    <polygon points="62,18 64,12 66,18" fill="#ffffff"/>
    <rect x="52" y="82" width="24" height="6" rx="2" fill="#fbbf24"/>
    <rect x="61" y="88" width="6" height="18" fill="#78350f"/>
    <circle cx="64" cy="110" r="5" fill="url(#ruby)"/>
  </g>
  <!-- Sword 2: Top-Right to Bottom-Left -->
  <g transform="rotate(-45 64 64)">
    <polygon points="62,18 66,18 67,82 61,82" fill="url(#steel)"/>
    <polygon points="62,18 64,12 66,18" fill="#ffffff"/>
    <rect x="52" y="82" width="24" height="6" rx="2" fill="#fbbf24"/>
    <rect x="61" y="88" width="6" height="18" fill="#78350f"/>
    <circle cx="64" cy="110" r="5" fill="url(#ruby)"/>
  </g>
  <!-- Shield Emblem Center -->
  <circle cx="64" cy="64" r="10" fill="#fbbf24"/>
  <circle cx="64" cy="64" r="6" fill="url(#ruby)"/>
</svg>