<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="bg10" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="diamondCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc"/><stop offset="40%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="diamondPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0e7ff"/><stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="diamondGlow"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <circle cx="64" cy="64" r="60" fill="url(#bg10)" stroke="#38bdf8" stroke-width="3"/>
  <!-- Brilliant Cut Diamond -->
  <g filter="url(#diamondGlow)">
    <polygon points="40,42 88,42 102,62 26,62" fill="url(#diamondCyan)"/>
    <polygon points="26,62 102,62 64,104" fill="url(#diamondPurple)"/>
    <!-- Facet lines -->
    <polygon points="50,42 78,42 86,62 42,62" fill="#cffafe" opacity="0.6"/>
    <polygon points="64,62 86,62 64,104" fill="#0ea5e9" opacity="0.7"/>
    <polygon points="42,62 64,62 64,104" fill="#38bdf8" opacity="0.8"/>
    <!-- Glare sparkles -->
    <polygon points="40,42 43,36 46,42 43,48" fill="#ffffff"/>
    <polygon points="88,42 90,38 92,42 90,46" fill="#ffffff"/>
  </g>
</svg>