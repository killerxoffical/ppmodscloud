  <text x="64" y="22" font-family="sans-serif" font-size="12" font-weight="900" fill="#ef4444" text-anchor="middle">N</text>
  <text x="64" y="116" font-family="sans-serif" font-size="11" font-weight="900" fill="#cbd5e1" text-anchor="middle">S</text>
  <text x="115" y="68" font-family="sans-serif" font-size="11" font-weight="900" fill="#cbd5e1" text-anchor="middle">E</text>
  <text x="13" y="68" font-family="sans-serif" font-size="11" font-weight="900" fill="#cbd5e1" text-anchor="middle">W</text>
