  <polygon points="64,36 42,64 64,64" fill="url(#ppBlue)"/>
  <polygon points="42,64 64,92 64,64" fill="url(#ppRed)"/>
  <polygon points="86,64 64,92 64,64" fill="url(#ppYellow)"/>
  <circle cx="64" cy="64" r="6" fill="#ffffff"/>
