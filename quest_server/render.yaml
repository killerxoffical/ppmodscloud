services:
  - type: web
    name: pp-mod-auto-quest
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python3 -m gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 16 --timeout 120 || python3 app.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
